name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the vMAJOR.MINOR.PATCH format."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution and test dependencies
        run: dotnet restore DiagnosticoLag.sln

      - name: Run automated tests
        run: >-
          dotnet test DiagnosticoLag.sln
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          if (Test-Path "DiagnosticoLag/bin") {
            Remove-Item "DiagnosticoLag/bin" -Recurse -Force
          }
          dotnet clean DiagnosticoLag/DiagnosticoLag.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet clean failed with exit code $LASTEXITCODE"
          }
          if (Test-Path "DiagnosticoLag/bin") {
            Remove-Item "DiagnosticoLag/bin" -Recurse -Force
          }
          if (Test-Path "artifacts") {
            Remove-Item "artifacts" -Recurse -Force
          }
          dotnet publish DiagnosticoLag/DiagnosticoLag.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$version" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/publish
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (!$compiler) {
            $knownPaths = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $compilerPath = $knownPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$compilerPath) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                throw "Installing Inno Setup failed with exit code $LASTEXITCODE"
              }
              $compilerPath = $knownPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (!$compilerPath) {
              throw "Inno Setup compiler ISCC.exe was not found"
            }
          } else {
            $compilerPath = $compiler.Source
          }

          $env:APP_VERSION = $env:RELEASE_TAG.TrimStart("v")
          $env:PUBLISH_DIR = (Resolve-Path "artifacts/publish").Path
          & $compilerPath "installer/Lagnostics.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Building the Windows installer failed with exit code $LASTEXITCODE"
          }

      - name: Check Windows signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice::Signing secrets are not configured; publishing unsigned release assets."
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Windows application and installer
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$signTool) {
            throw "Windows SDK SignTool was not found"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "lagnostics-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
            )

            $version = $env:RELEASE_TAG.TrimStart("v")
            $filesToSign = @(
              "artifacts/publish/DiagnosticoLag.exe",
              "artifacts/installer/DiagnosticoLag-$version-win-x64-setup.exe"
            )
            foreach ($file in $filesToSign) {
              if (!(Test-Path $file)) {
                throw "File to sign was not found: $file"
              }
              & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $file
              if ($LASTEXITCODE -ne 0) {
                throw "Signing $file failed with exit code $LASTEXITCODE"
              }
              & $signTool verify /pa /all $file
              if ($LASTEXITCODE -ne 0) {
                throw "Signature verification failed for $file"
              }
            }
          }
          finally {
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force
            }
          }

      - name: Build MSIX package for Microsoft Store
        id: msix
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'MagusMan.Lagnostics-Diagnsticodelag' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=45FBBBAE-FC3F-4B9A-8217-90F751D885B5' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'MagusMan' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_IDENTITY_NAME) -or
              [string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER_DISPLAY_NAME)) {
            "built=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::MSIX_IDENTITY_NAME, MSIX_PUBLISHER or MSIX_PUBLISHER_DISPLAY_NAME repository variables are missing; skipping MSIX."
            exit 0
          }
          $version = $env:RELEASE_TAG.TrimStart("v")
          ./packaging/msix/Build-Msix.ps1 `
            -Version $version `
            -PublishDir (Resolve-Path "artifacts/publish").Path `
            -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME `
            -OutputDir "artifacts/msix"
          "built=true" >> $env:GITHUB_OUTPUT

      - name: Package and create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSIX_BUILT: ${{ steps.msix.outputs.built }}
        run: |
          $executable = "artifacts/publish/DiagnosticoLag.exe"
          if (!(Test-Path $executable)) {
            throw "Publish did not produce $executable"
          }

          $archive = "DiagnosticoLag-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $archive
          $installer = "artifacts/installer/DiagnosticoLag-$($env:RELEASE_TAG.TrimStart('v'))-win-x64-setup.exe"
          if (!(Test-Path $installer)) {
            throw "Installer build did not produce $installer"
          }
          $releaseArgs = @(
            $env:RELEASE_TAG,
            $archive,
            $installer
          )
          if ($env:MSIX_BUILT -eq "true") {
            $releaseArgs += (Get-ChildItem "artifacts/msix" -Filter *.msix | Select-Object -First 1 -ExpandProperty FullName)
          }
          $releaseArgs += @(
            "--title", "Diagnóstico Lag $env:RELEASE_TAG",
            "--generate-notes",
            "--verify-tag",
            "--latest"
          )
          gh release create @releaseArgs
